<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backcountry Finale — Before you arrive</title>
<style>
  :root{
    /* BCK brand palette — literal ratio from the brand deck: 45% black / 45% white / 10% lime */
    --bg:#111111;
    --paper:#FFFFFF;
    --ink:#111111;
    --ink-soft:#54565B;
    --accent:#BFFF00;
    --line:#E2E2E2;
    --line-dark:rgba(255,255,255,0.22);
    --on-dark-soft:rgba(255,255,255,0.56);
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    font-family:var(--font);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    position:relative;
    overflow-x:hidden;
  }
  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:600px;
  }
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; padding:0 4px;
  }
  .masthead .brand{
    font-family:var(--font); font-weight:700; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; color:#FFFFFF;
    display:inline-flex; align-items:center; gap:7px;
  }
  .masthead .brand b{color:var(--accent); font-weight:800;}
  .mast-icon{ height:18px; width:auto; display:block; }
  .masthead .dest{
    font-family:var(--font); font-weight:500; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--on-dark-soft); text-align:right;
  }

  .trail{
    width:100%; height:96px; display:block; margin-bottom:-2px;
  }

  .card{
    background:var(--paper);
    border:1px solid #1a1a1a;
    clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
    padding:38px 34px 28px;
    min-height:340px;
    display:flex; flex-direction:column;
    box-shadow:0 22px 44px -20px rgba(0,0,0,0.55);
  }
  .eyebrow{
    font-family:var(--font); font-weight:700; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px;
  }
  .q-title{
    font-family:var(--font); font-weight:800;
    font-size:36px; line-height:0.98; letter-spacing:.005em; margin:0 0 12px;
    text-transform:uppercase; color:var(--ink);
    transform:scaleX(1.05); transform-origin:left;
  }
  .q-prompt{
    font-size:15.5px; line-height:1.55; color:var(--ink-soft); margin:0 0 20px; max-width:46ch; font-weight:400;
  }
  .q-prompt.small{ margin:22px 0 10px; font-size:14px; }

  .step-body{ flex:1; }

  textarea.input-area, input.input-line, select.input-select{
    width:100%; font-family:var(--font); font-size:15px; color:var(--ink);
    background:#FAFAFA; border:1px solid var(--line); padding:12px 14px;
    border-radius:2px; outline:none; transition:border-color .15s ease;
  }
  textarea.input-area{ min-height:100px; resize:vertical; line-height:1.5; }
  textarea.input-area:focus, input.input-line:focus, select.input-select:focus{ border-color:var(--ink); }
  ::placeholder{ color:#A6A6A6; }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    font-family:var(--font); font-weight:600; font-size:13.5px;
    padding:10px 15px; border:1px solid var(--line); background:#FAFAFA;
    color:var(--ink-soft); border-radius:2px; cursor:pointer;
    transition:all .12s ease; letter-spacing:.01em;
  }
  .pill:hover{ border-color:var(--ink); }
  .pill.is-selected{ background:var(--accent); border-color:var(--accent); color:var(--ink); font-weight:700; }

  .kit-block + .kit-block{ margin-top:22px; }

  .rank-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .rank-item{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    padding:12px 14px; border:1px solid var(--line); background:#FAFAFA;
    border-radius:2px; cursor:pointer; font-family:var(--font);
    font-size:14.5px; color:var(--ink); transition:all .12s ease;
  }
  .rank-item:hover{ border-color:var(--ink); }
  .rank-item.is-ranked{ background:var(--accent); border-color:var(--accent); color:var(--ink); font-weight:700; }
  .rank-badge{
    font-family:var(--font); font-size:12px; font-weight:700;
    width:22px; height:22px; border-radius:50%; border:1px solid currentColor;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .select-label{
    display:block; font-family:var(--font); font-weight:700; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:18px;
  }
  .select-label select{ margin-top:7px; }

  .check-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .check-item{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border:1px solid var(--line); background:#FAFAFA; border-radius:2px;
    cursor:pointer; font-size:14.5px; transition:all .12s ease;
  }
  .check-item:hover{ border-color:var(--ink); }
  .check-item.is-checked{ background:var(--accent); border-color:var(--accent); color:var(--ink); font-weight:600; }
  .check-item input{ accent-color:var(--ink); width:16px; height:16px; flex-shrink:0; }

  .hero{ display:flex; flex-direction:column; justify-content:center; flex:1; }
  .hero-icon{ height:56px; width:auto; display:block; margin-bottom:20px; align-self:flex-start; flex-shrink:0; }
  .hero .kicker{
    font-family:var(--font); font-weight:700; font-size:11.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px;
  }
  .hero .kicker b{ color:var(--ink); border-bottom:3px solid var(--accent); }
  .hero h1{
    font-family:var(--font); font-weight:800; text-transform:uppercase;
    font-size:46px; line-height:0.92; margin:0 0 18px; color:var(--ink);
    transform:scaleX(1.05); transform-origin:left;
  }
  .hero p{ font-size:15.5px; line-height:1.6; color:var(--ink-soft); max-width:44ch; margin:0 0 6px; }

  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
  }
  .nav-btn{
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:.06em;
    text-transform:uppercase; background:none; border:none; cursor:pointer;
    color:var(--ink-soft); padding:8px 4px; transition:color .12s ease;
  }
  .nav-btn:hover{ color:var(--ink); }
  .nav-btn.primary{
    background:var(--ink); color:#FFFFFF; padding:11px 22px; border-radius:2px;
  }
  .nav-btn.primary:hover{ background:var(--accent); color:var(--ink); }
  .nav-btn[disabled]{ opacity:0; pointer-events:none; }
  .nav-spacer{ flex:1; }

  .thanks{ text-align:center; padding:20px 0; }
  .thanks-icon{ height:42px; width:auto; display:block; margin:0 auto 16px; }
  .thanks .stamp{
    font-family:var(--font); font-weight:800; font-size:32px;
    text-transform:uppercase; color:var(--ink); margin-bottom:14px;
    transform:scaleX(1.05);
  }
  .thanks p{ color:var(--ink-soft); font-size:15px; line-height:1.6; max-width:42ch; margin:0 auto 10px; }
  .thanks-actions{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:18px; }
  .copy-btn{
    font-family:var(--font); font-weight:700; font-size:12.5px;
    letter-spacing:.05em; text-transform:uppercase; background:none;
    border:1px solid var(--line); padding:11px 20px; border-radius:2px; cursor:pointer; color:var(--ink-soft);
    display:inline-block; text-decoration:none;
  }
  .copy-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .copy-btn--primary{ background:var(--ink); color:#FFFFFF; border-color:var(--ink); }
  .copy-btn--primary:hover{ background:var(--accent); color:var(--ink); border-color:var(--accent); }

  @media (max-width:480px){
    .q-title{ font-size:29px; }
    .card{ padding:30px 22px 24px; }
    .hero h1{ font-size:35px; }
  }
</style>
</head>

    {v:'C1-C2', l:'C1–C2 · fluent, near-native'}
  ];
  var EXCITE_ITEMS = [
    {id:'social', label:'Social content'},
    {id:'product', label:'Product & merch design'},
    {id:'website', label:'Our website'},
    {id:'newsletter', label:'Newsletter design'},
    {id:'archive', label:'10th anniversary archive'},
    {id:'events', label:'Events (planning, making things, on-site setup, comms)'}
  ];
  var TOOL_OPTIONS = [
    {id:'photoshop', label:'Photoshop'},
    {id:'premiere', label:'Premiere Pro'},
    {id:'canva', label:'Canva'},
    {id:'other', label:'Other'}
  ];
  var AHEAD_ITEMS = [
    {id:'portfolio', label:'A specific piece for my portfolio (a video, a design, a mini case study...)'},
    {id:'skill', label:'A new skill I didn\'t have before'},
    {id:'made', label:'Something concrete I can point to and say "I made this"'},
    {id:'experience', label:'A great experience living and working in Finale'}
  ];

  var STEPS = [
    {id:'welcome', type:'welcome'},
    {id:'about', type:'textarea', title:'About you', prompt:"We've seen your portfolio, so we already know the design side. Tell us a bit more about you outside of that: hobbies, what you're into, anything that helps us get to know you.", placeholder:"I'm Anouk, I..."},
    {id:'kit', type:'kit'},
    {id:'toolsselect', type:'toolsselect'},
    {id:'anythingelse', type:'text', title:'Anything else?', prompt:'Any other tool or software worth mentioning? Totally optional.', placeholder:'Optional'},
    {id:'excites', type:'ranking'},
    {id:'goals', type:'textarea', title:'What do you want to do with us', prompt:"Beyond what excites you most, is there something specific you're hoping to work on, try, or learn while you're with us? Tell us in your own words.", placeholder:"I'd love to..."},
    {id:'finale', type:'textarea', title:'Beyond the internship', prompt:"Living in Finale for a few months is its own experience. What are you hoping to get out of it, outside of work?", placeholder:"I'm hoping to..."},
    {id:'english', type:'english'},
    {id:'ahead', type:'ahead'},
    {id:'thankyou', type:'thankyou'}
  ];

  function totalQ(){ return STEPS.length - 2; } // excludes welcome + thankyou

  var answers = {
    about:'', kit:{laptop:'', software:''},
    tools:{selected:[], otherName:''}, toolLevels:{},
    anythingelse:'',
    excites:{order:[], other:''},
    goals:'', finale:'',
    english:{written:'', spoken:'', other:''},
    ahead:{selected:[], other:''}
  };

  var current = 0;

  function getPath(obj, path){
    var parts = path.split('.');
    return parts.length === 1 ? obj[parts[0]] : obj[parts[0]][parts[1]];
  }
  function setPath(obj, path, value){
    var parts = path.split('.');
    if(parts.length === 1){ obj[parts[0]] = value; } else { obj[parts[0]][parts[1]] = value; }
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function pillGroup(path, options, current){
    return options.map(function(o){
      var sel = current === o ? ' is-selected' : '';
      return '<button type="button" class="pill' + sel + '" data-group="' + path + '" data-value="' + esc(o) + '">' + esc(o) + '</button>';
    }).join('');
  }

  function cefrOptions(path, current){
    var out = '<option value="">— choose —</option>';
    CEFR.forEach(function(c){
      out += '<option value="' + c.v + '"' + (current === c.v ? ' selected' : '') + '>' + esc(c.l) + '</option>';
    });
    return out;
  }

  function renderBody(step){
    switch(step.type){
      case 'welcome':
        return {eyebrow:'', html:
          '<div class="hero">' +
            '<img src="' + ICON_BLACK + '" class="hero-icon" alt="">' +
            '<div class="kicker">Before you get here · <b>October</b></div>' +
            '<h1>Hey Anouk</h1>' +
            '<p>Before you join us, we\'d love to get to know you a bit, so we can build a project together that actually fits what you\'re good at and curious about.</p>' +
            '<p>This isn\'t a test. There are no wrong answers, and it\'s fine to skip anything that doesn\'t apply. Takes about five minutes.</p>' +
          '</div>'};

      case 'textarea':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">' + esc(step.title) + '</h2>' +
          '<p class="q-prompt">' + esc(step.prompt) + '</p>' +
          '<textarea class="input-area" data-path="' + step.id + '" placeholder="' + esc(step.placeholder||'') + '">' + esc(getPath(answers, step.id) || '') + '</textarea>'};

      case 'text':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">' + esc(step.title) + '</h2>' +
          '<p class="q-prompt">' + esc(step.prompt) + '</p>' +
          '<input type="text" class="input-line" data-path="' + step.id + '" placeholder="' + esc(step.placeholder||'') + '" value="' + esc(getPath(answers, step.id) || '') + '">'};

      case 'kit':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">Your kit</h2>' +
          '<div class="kit-block">' +
            '<p class="q-prompt">Will you be bringing your own laptop? No worries either way, we\'ll make sure you\'re not glued to a screen the whole time.</p>' +
            '<div class="pill-row">' + pillGroup('kit.laptop', ['Yes','No','Not sure'], answers.kit.laptop) + '</div>' +
          '</div>' +
          '<div class="kit-block">' +
            '<p class="q-prompt small">Do you already have access to any design software (Photoshop, Illustrator, Canva, etc.)?</p>' +
            '<input type="text" class="input-line" data-path="kit.software" placeholder="e.g. school license for Adobe..." value="' + esc(answers.kit.software) + '">' +
          '</div>'};

      case 'scale':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">' + esc(step.title) + '</h2>' +
          '<p class="q-prompt">' + esc(step.prompt) + '</p>' +
          '<div class="pill-row">' + pillGroup(step.id, SCALE_OPTIONS, answers[step.id]) + '</div>'};

      case 'toolsselect':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">Your tools</h2>' +
          '<p class="q-prompt">Which of these do you already use? Tap all that apply.</p>' +
          '<div class="check-list">' + TOOL_OPTIONS.map(function(o){
            var checked = answers.tools.selected.indexOf(o.id) > -1;
            return '<label class="check-item' + (checked ? ' is-checked' : '') + '"><input type="checkbox" data-tool-id="' + o.id + '" ' + (checked ? 'checked' : '') + '><span>' + esc(o.label) + '</span></label>';
          }).join('') + '</div>' +
          (answers.tools.selected.indexOf('other') > -1 ?
            '<input type="text" class="input-line" data-path="tools.otherName" placeholder="Which tool?" value="' + esc(answers.tools.otherName) + '">' : '')};

      case 'toollevel':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">' + esc(step.title) + '</h2>' +
          '<p class="q-prompt">' + esc(step.prompt) + '</p>' +
          '<div class="pill-row">' + pillGroup('toolLevels.' + step.toolId, SCALE_OPTIONS, answers.toolLevels[step.toolId]) + '</div>'};

      case 'ranking':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">What excites you</h2>' +
          '<p class="q-prompt">Here\'s what we work on: social content, product & merch design, our website, our newsletter, building an archive for our 10th anniversary, and events (planning, making things, on-site setup, comms, and more). Tap them in order of preference, most exciting first (tap again to undo).</p>' +
          '<div class="rank-list">' + EXCITE_ITEMS.map(function(it){
            var pos = answers.excites.order.indexOf(it.id);
            return '<button type="button" class="rank-item' + (pos > -1 ? ' is-ranked' : '') + '" data-rank-id="' + it.id + '">' +
              '<span class="rank-badge">' + (pos > -1 ? (pos+1) : '') + '</span>' +
              '<span>' + esc(it.label) + '</span></button>';
          }).join('') + '</div>' +
          '<p class="q-prompt small">Anything else you\'d like to try that\'s not on this list?</p>' +
          '<input type="text" class="input-line" data-path="excites.other" placeholder="Optional" value="' + esc(answers.excites.other) + '">'};

      case 'english':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">Languages</h2>' +
          '<p class="q-prompt">Just your honest self-assessment, there\'s no wrong answer here.</p>' +
          '<label class="select-label">Written English<select class="input-select" data-path="english.written">' + cefrOptions('english.written', answers.english.written) + '</select></label>' +
          '<label class="select-label">Spoken English<select class="input-select" data-path="english.spoken">' + cefrOptions('english.spoken', answers.english.spoken) + '</select></label>' +
          '<p class="q-prompt small">Any other languages besides English? (Dutch counts!)</p>' +
          '<input type="text" class="input-line" data-path="english.other" placeholder="e.g. Dutch, German..." value="' + esc(answers.english.other) + '">'};

      case 'ahead':
        return {eyebrow:'WAYPOINT ' + questionIndex(step) + ' / ' + totalQ(), html:
          '<h2 class="q-title">Looking ahead</h2>' +
          '<p class="q-prompt">When you think about the end of your time here, what would feel like a real win? Pick as many as you like.</p>' +
          '<div class="check-list">' + AHEAD_ITEMS.map(function(it){
            var checked = answers.ahead.selected.indexOf(it.id) > -1;
            return '<label class="check-item' + (checked ? ' is-checked' : '') + '"><input type="checkbox" data-ahead-id="' + it.id + '" ' + (checked ? 'checked' : '') + '><span>' + esc(it.label) + '</span></label>';
          }).join('') + '</div>' +
          '<input type="text" class="input-line" data-path="ahead.other" placeholder="Something else? Tell us." value="' + esc(answers.ahead.other) + '">'};

      case 'thankyou':
        var mailBody = encodeURIComponent(formatAnswersAsText());
        var mailHref = 'mailto:info@alteralab.it?subject=' + encodeURIComponent('Anouk — pre-arrival questionnaire') + '&body=' + mailBody;
        return {eyebrow:'ARRIVED', html:
          '<div class="thanks"><img src="' + ICON_BLACK + '" class="thanks-icon" alt="">' +
          '<div class="stamp">You\'re in.</div>' +
          '<p>Thanks, Anouk! Tap the button below, it opens an email to us with all your answers already filled in. Just hit send.</p>' +
          '<div class="thanks-actions">' +
            '<a class="copy-btn copy-btn--primary" href="' + mailHref + '">Email us your answers</a>' +
            '<button class="copy-btn" id="btn-copy">Or copy them instead</button>' +
          '</div></div>'};
    }
  }

  function questionIndex(step){
    var qSteps = STEPS.filter(function(s){ return s.type !== 'welcome' && s.type !== 'thankyou'; });
    return qSteps.indexOf(step) + 1;
  }

  // ---- elevation trail ----
  var ELEV = [[0,190],[75,165],[150,178],[225,138],[300,150],[375,108],[450,122],[525,80],[600,95],[675,55],[750,68],[825,35],[900,45],[1000,18]];
  function pathD(points){
    return points.map(function(p,i){ return (i===0?'M':'L') + p[0] + ',' + p[1]; }).join(' ');
  }
  function elevY(x){
    for(var i=0;i<ELEV.length-1;i++){
      var a=ELEV[i], b=ELEV[i+1];
      if(x>=a[0] && x<=b[0]){
        var t=(x-a[0])/(b[0]-a[0]);
        return a[1] + t*(b[1]-a[1]);
      }
    }
    return ELEV[ELEV.length-1][1];
  }
  function updateTrail(frac){
    var d = pathD(ELEV);
    document.getElementById('trail-base').setAttribute('d', d);
    document.getElementById('trail-fill').setAttribute('d', d);
    var x = frac * 1000;
    var y = elevY(x);
    document.getElementById('trail-clip-rect').setAttribute('width', x);
    document.getElementById('trail-dot').setAttribute('cx', x);
    document.getElementById('trail-dot').setAttribute('cy', y);
    var guide = document.getElementById('trail-guide');
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('y1', y+8); guide.setAttribute('y2', 205);
    var flag = document.getElementById('trail-flag');
    if(frac >= 0.999){
      flag.setAttribute('points', '1000,18 1000,0 1014,6 1000,12');
      flag.setAttribute('opacity', '1');
    } else {
      flag.setAttribute('opacity', '0');
    }
  }

  function attachHandlers(){
    var body = document.getElementById('step-body');

    body.querySelectorAll('textarea[data-path], input.input-line[data-path], select[data-path]').forEach(function(el){
      var evt = el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(evt, function(){ setPath(answers, el.getAttribute('data-path'), el.value); });
    });

    body.querySelectorAll('.pill[data-group]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var group = btn.getAttribute('data-group');
        var value = btn.getAttribute('data-value');
        var current = getPath(answers, group);
        setPath(answers, group, current === value ? '' : value);
        renderStep(currentIdx, true);
      });
    });

    body.querySelectorAll('.rank-item[data-rank-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-rank-id');
        var order = answers.excites.order;
        var pos = order.indexOf(id);
        if(pos > -1){ order.splice(pos,1); } else { order.push(id); }
        renderStep(currentIdx, true);
      });
    });

    body.querySelectorAll('input[data-ahead-id]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var id = cb.getAttribute('data-ahead-id');
        var sel = answers.ahead.selected;
        var pos = sel.indexOf(id);
        if(cb.checked && pos === -1){ sel.push(id); }
        if(!cb.checked && pos > -1){ sel.splice(pos,1); }
        renderStep(currentIdx, true);
      });
    });

    body.querySelectorAll('input[data-tool-id]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var id = cb.getAttribute('data-tool-id');
        var sel = answers.tools.selected;
        var pos = sel.indexOf(id);
        if(cb.checked && pos === -1){ sel.push(id); }
        if(!cb.checked && pos > -1){ sel.splice(pos,1); }
        renderStep(currentIdx, true);
      });
    });

    var copyBtn = document.getElementById('btn-copy');
    if(copyBtn){
      copyBtn.addEventListener('click', function(){
        var text = formatAnswersAsText();
        navigator.clipboard.writeText(text).then(function(){
          copyBtn.textContent = 'Copied ✓';
          setTimeout(function(){ copyBtn.textContent = 'Or copy them instead'; }, 2000);
        }).catch(function(){
          copyBtn.textContent = 'Could not copy';
        });
      });
    }
  }

  var currentIdx = 0;

  function syncToolSteps(){
    for(var i = STEPS.length - 1; i >= 0; i--){
      if(STEPS[i].dynamic){ STEPS.splice(i, 1); }
    }
    var anchor = -1;
    for(var j = 0; j < STEPS.length; j++){
      if(STEPS[j].id === 'toolsselect'){ anchor = j; break; }
    }
    var newSteps = TOOL_OPTIONS.filter(function(o){
      return answers.tools.selected.indexOf(o.id) > -1;
    }).map(function(o){
      var label = o.id === 'other' ? (answers.tools.otherName || 'Other tool') : o.label;
      return {id:'toollevel-' + o.id, type:'toollevel', toolId:o.id, dynamic:true, title:label, prompt:'Have you used ' + label + ' before?'};
    });
    STEPS.splice.apply(STEPS, [anchor + 1, 0].concat(newSteps));
  }

  function renderStep(idx, preserveScroll){
    syncToolSteps();
    currentIdx = idx;
    var step = STEPS[idx];
    var out = renderBody(step);
    document.getElementById('step-body').innerHTML = out.html;
    document.getElementById('masthead-dest').textContent = out.eyebrow || (step.type === 'welcome' ? 'START' : '');

    var frac = idx / (STEPS.length - 1);
    updateTrail(frac);

    var backBtn = document.getElementById('btn-back');
    var nextBtn = document.getElementById('btn-next');
    if(idx === 0 || step.type === 'thankyou'){ backBtn.setAttribute('disabled','disabled'); }
    else { backBtn.removeAttribute('disabled'); }

    if(step.type === 'thankyou'){ nextBtn.style.display = 'none'; }
    else {
      nextBtn.style.display = '';
      if(step.type === 'welcome'){ nextBtn.textContent = "LET'S GO →"; }
      else if(STEPS[idx+1] && STEPS[idx+1].type === 'thankyou'){ nextBtn.textContent = 'SUBMIT →'; }
      else { nextBtn.textContent = 'NEXT →'; }
      nextBtn.removeAttribute('disabled');
    }

    attachHandlers();
    if(!preserveScroll){ window.scrollTo({top:0, behavior:'smooth'}); }
  }

  function formatAnswersAsText(){
    var lines = [];
    lines.push('Anouk — pre-arrival questionnaire');
    lines.push('');
    lines.push('About: ' + (answers.about || '—'));
    lines.push('Laptop: ' + (answers.kit.laptop || '—') + ' | Software access: ' + (answers.kit.software || '—'));
    var toolLines = TOOL_OPTIONS.filter(function(o){ return answers.tools.selected.indexOf(o.id) > -1; }).map(function(o){
      var label = o.id === 'other' ? (answers.tools.otherName || 'Other tool') : o.label;
      return label + ': ' + (answers.toolLevels[o.id] || '—');
    });
    lines.push('Tools used: ' + (toolLines.length ? toolLines.join(' | ') : '—'));
    lines.push('Other tools: ' + (answers.anythingelse || '—'));
    var ranked = answers.excites.order.map(function(id){
      return EXCITE_ITEMS.find(function(i){ return i.id === id; }).label;
    });
    lines.push('Excites (ranked): ' + (ranked.length ? ranked.join(' > ') : '—') + ' | Other: ' + (answers.excites.other || '—'));
    lines.push('Wants to do with us: ' + (answers.goals || '—'));
    lines.push('Beyond the internship: ' + (answers.finale || '—'));
    lines.push('English written: ' + (answers.english.written || '—') + ' | spoken: ' + (answers.english.spoken || '—') + ' | other languages: ' + (answers.english.other || '—'));
    var ahead = answers.ahead.selected.map(function(id){
      return AHEAD_ITEMS.find(function(i){ return i.id === id; }).label;
    });
    lines.push('Looking ahead: ' + (ahead.length ? ahead.join(' | ') : '—') + ' | Other: ' + (answers.ahead.other || '—'));
    return lines.join('\n');
  }

  document.getElementById('btn-next').addEventListener('click', function(){
    renderStep(currentIdx + 1);
  });
  document.getElementById('btn-back').addEventListener('click', function(){
    if(currentIdx > 0){ renderStep(currentIdx - 1); }
  });

  renderStep(0);
})();
</script>
</body>
</html>
